# hyprlock — fallback lock screen (the shell has its own): blurred wallpaper, big clock, info in the corners
# Clear the password: ESC, Ctrl+U, Ctrl+Backspace

$font  = JetBrainsMono Nerd Font
$info  = ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/lockinfo.sh

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.local/state/wallpaper   # link to the current wallpaper (scripts/wallpaper.sh)
    color = rgb(0b1012)
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.2
}

# ---- center ----

# greeting
label {
    monitor =
    text = cmd[update:600000] $info greet
    font_size = 13
    font_family = $font
    color = rgba(e6b450ff)
    position = 0, 230
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font ExtraBold
    color = rgba(dfe4e5ff)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0b0d12aa)
    position = 0, 120
    halign = center
    valign = center
}

# accent dash below the time
shape {
    monitor =
    size = 70, 3
    color = rgba(e6b450ff)
    rounding = 0
    position = 0, 30
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] $info date
    font_size = 16
    font_family = $font
    color = rgba(dfe4e5cc)
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 48
    outline_thickness = 2
    rounding = 0
    inner_color = rgba(0f1416dd)
    outer_color = rgba(e6b450ff) rgba(9fd3dcff) 45deg
    check_color = rgba(9ece6aff) rgba(e6b450ff) 45deg
    fail_color = rgba(f07178ff) rgba(ff9e64ff) 45deg
    capslock_color = rgba(9fd3dcff)
    font_color = rgba(dfe4e5ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##8b91a3">󰌾  password</span>
    fail_text = <span foreground="##ff5a5f">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_rounding = 12
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0b0d12aa)
    position = 0, -90
    halign = center
    valign = center
}

# now playing (empty when nothing plays)
label {
    monitor =
    text = cmd[update:2000] $info media
    font_size = 11
    font_family = $font
    color = rgba(9fd3dcff)
    position = 0, -160
    halign = center
    valign = center
}

# ---- corners ----

# bottom left: user@host
label {
    monitor =
    text = 󰣇  $USER@$(hostname)
    font_size = 11
    font_family = $font
    color = rgba(e6b450ff)
    position = 30, 24
    halign = left
    valign = bottom
}

# bottom right: battery + keyboard layout
label {
    monitor =
    text = cmd[update:10000] $info battery
    font_size = 11
    font_family = $font
    color = rgba(9ece6aff)
    position = -30, 24
    halign = right
    valign = bottom
}
label {
    monitor =
    text = 󰌌  $LAYOUT
    font_size = 11
    font_family = $font
    color = rgba(899395ff)
    position = -140, 24
    halign = right
    valign = bottom
}
