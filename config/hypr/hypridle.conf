# hypridle — https://wiki.hypr.land/Hypr-Ecosystem/hypridle

general {
    # shell lock screen; hyprlock as fallback if Quickshell doesn't answer
    lock_cmd = quickshell ipc call shell lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session                          # lock before suspending
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn the screen back on after resume
}

# 2.5 min: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: lock the screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: turn the display off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
