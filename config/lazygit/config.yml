# lazygit — default theme colors
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor: ["#a99cf0", bold]
    inactiveBorderColor: ["#4a5675"]
    searchingActiveBorderColor: ["#8fd0e0", bold]
    optionsTextColor: ["#a99cf0"]
    selectedLineBgColor: ["#202c48"]
    inactiveViewSelectedLineBgColor: ["#1c2b45"]
    cherryPickedCommitFgColor: ["#7fd3c8"]
    cherryPickedCommitBgColor: ["#2a3756"]
    markedBaseCommitFgColor: ["#7fd3c8"]
    markedBaseCommitBgColor: ["#8fd0e0"]
    unstagedChangesColor: ["#ff5a5f"]
    defaultFgColor: ["#f4f2ec"]
