# kitty — https://sw.kovidgoyal.net/kitty/conf/

include theme.conf

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Look ---
window_padding_width   10 14
# high enough that the desktop widgets do not show through the text
background_opacity     0.94
hide_window_decorations yes
confirm_os_window_close 0
# no config watcher process (~20 MB): after editing this file press ctrl+shift+f5 to reload
auto_reload_config     -1
enable_audio_bell      no

# --- Cursor ---
cursor_shape           block
cursor_blink_interval  0
cursor_trail           3

# --- Scrollback ---
scrollback_lines       10000

# --- Tabs ---
tab_bar_edge           top
tab_bar_style          powerline
tab_title_template     " {index} {title} "
tab_title_max_length   28

# --- Layout (split) ---
enabled_layouts splits,stack

# --- Copy / paste ---
# Ctrl+C copies when text is selected, otherwise interrupts the command (SIGINT)
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
copy_on_select no

# --- Tabs and splits ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+z toggle_layout stack
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# --- Font size on the fly ---
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# slanted: the 45° cut, like the rest of bezel
tab_powerline_style    slanted
tab_bar_min_tabs       2
active_tab_font_style  bold
inactive_tab_font_style normal
cursor_trail_decay     0.1 0.35
# tab and split-border colours live in theme.conf
window_border_width    1pt
draw_minimal_borders   yes