# starship — https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

palette = "default"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration
$character"""

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold peach"

[golang]
symbol = " "
style = "bold sky"

[java]
symbol = " "
style = "bold red"

[docker_context]
symbol = " "
style = "bold blue"

# palette (kept the previous color names so the styles above stay valid)
[palettes.default]
rosewater = "#ffb46b"
flamingo = "#ffb46b"
pink = "#8fd0e0"
mauve = "#8fd0e0"
red = "#ff5a5f"
maroon = "#ff5a5f"
peach = "#ffb46b"
yellow = "#8fd0e0"
green = "#9bd48a"
teal = "#7fd3c8"
sky = "#a99cf0"
sapphire = "#a99cf0"
blue = "#a99cf0"
lavender = "#a99cf0"
text = "#f4f2ec"
subtext1 = "#f4f2ec"
subtext0 = "#c4c7d1"
overlay2 = "#c39ff0"
