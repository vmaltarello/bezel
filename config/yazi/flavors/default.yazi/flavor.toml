## Color palette
## Check https://github.com/rebelot/kanagawa.nvim for more details
# sumiInk0      "#0a0f1c" dark bg
# sumiInk3      "#0f1628" bg
# sumiInk4      "#202c48"
# sumiInk6      "#4a5675"
# fujiWhite     "#f4f2ec" fg
# oldWhite      "#c4c7d1" dark fg
# fujiGray      "#8b91a3"
# peachRed      "#ff5a5f"
# autumnRed     "#d95757"
# crystalBlue   "#a99cf0"
# waveRed       "#c96b72"
# carpYellow    "#8fd0e0"
# springGreen   "#9bd48a"
# autumnGreen   "#7fbf6e"
# oniViolet     "#8fd0e0"
# waveAqua1     "#74b8b0"
# surimiOrange  "#ffb46b"
# waveAqua2     "#7fc9bd"

[mgr]
marker_copied = { fg = "#9bd48a", bg = "#9bd48a" }
marker_cut = { fg = "#c96b72", bg = "#c96b72" }
marker_marked = { fg = "#8fd0e0", bg = "#8fd0e0" }
marker_selected = { fg = "#ffb46b", bg = "#ffb46b" }

cwd = { fg = "#f4f2ec", bold = true }

find_keyword = { fg = "#ffb46b", bg = "#0f1628" }
find_position = {}

count_copied = { fg = "#0f1628", bg = "#9bd48a" }
count_cut = { fg = "#0f1628", bg = "#c96b72" }
count_selected = { fg = "#0f1628", bg = "#ffb46b" }

border_symbol = "│"
border_style = { fg = "#4a5675" }

[indicator]
parent = { bg = "#202c48" }
current = { bg = "#29244d", bold = true }
preview = { bg = "#202c48" }

[tabs]
active = { fg = "#0f1628", bg = "#a99cf0" }
inactive = { fg = "#a99cf0", bg = "#202c48" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


[mode]
normal_main = { fg = "#0f1628", bg = "#a99cf0" }
normal_alt = { fg = "#a99cf0", bg = "#202c48" }
select_main = { fg = "#0f1628", bg = "#8fd0e0" }
select_alt = { fg = "#8fd0e0", bg = "#202c48" }
unset_main = { fg = "#0f1628", bg = "#8fd0e0" }
unset_alt = { fg = "#8fd0e0", bg = "#202c48" }


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#c4c7d1", bg = "#0f1628" }

progress_label = { fg = "#a99cf0", bold = true }
progress_normal = { fg = "#202c48", bg = "#0f1628" }
progress_error = { fg = "#202c48", bg = "#0f1628" }

perm_type = { fg = "#9bd48a" }
perm_read = { fg = "#8fd0e0" }
perm_write = { fg = "#ff5a5f" }
perm_exec = { fg = "#7fc9bd" }
perm_sep = { fg = "#8fd0e0" }


[pick]
border = { fg = "#7fd3c8" }
active = { fg = "#8fd0e0", bold = true }
inactive = {}

[input]
border = { fg = "#7fd3c8" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#7fd3c8" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "#7fd3c8" }
title = {}
hovered = { fg = "#8fd0e0" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#8b91a3" }
mask = { bg = "#0a0f1c" }
rest = { fg = "#8b91a3" }
cand = { fg = "#a99cf0" }
desc = { fg = "#4a5675" }

[help]
on = { fg = "#7fc9bd" }
run = { fg = "#8fd0e0" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#0f1628", bg = "#f4f2ec" }

[notify]
title_info = { fg = "#9bd48a" }
title_warn = { fg = "#8fd0e0" }
title_error = { fg = "#ff5a5f" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "#8fd0e0" },

    # media
    { mime = "{audio,video}/*", fg = "#8fd0e0" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c96b72" },

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#74b8b0" },

    # broken links
    { url = "*", is = "orphan", fg = "#d95757" },

    # executables
    { url = "*", is = "exec", fg = "#7fbf6e" },

    # fallback
    { url = "*", fg = "#f4f2ec" },
    { url = "*/", fg = "#a99cf0" },
]
